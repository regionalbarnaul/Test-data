<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тест микрофона</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#060a08; color:#e8f5f0; padding:20px; min-height:100vh; display:flex; flex-direction:column; }
h1 { font-size:22px; font-weight:800; margin-bottom:8px; background:linear-gradient(135deg,#a7f3d0,#10b981); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.sub { font-size:13px; color:#6b8a7d; margin-bottom:20px; line-height:1.5; }

.card { background:linear-gradient(180deg, rgba(26,38,32,0.72), rgba(18,26,22,0.72)); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:16px; margin-bottom:12px; }
.card-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#7c9b8d; margin-bottom:8px; font-weight:700; }
.card-value { font-size:15px; color:#e8f5f0; line-height:1.5; word-wrap:break-word; min-height:22px; }
.card-value.ok { color:#10b981; font-weight:700; }
.card-value.fail { color:#ef4444; font-weight:700; }

.mic-btn {
  width:100%; padding:20px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#0a0f0d; border:none; border-radius:16px;
  font-size:17px; font-weight:800; cursor:pointer;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(16,185,129,0.3);
  transition:transform 0.15s;
}
.mic-btn:active { transform:scale(0.97); }
.mic-btn.listening {
  background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;
  animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow:0 6px 20px rgba(239,68,68,0.4); }
  50% { box-shadow:0 6px 30px rgba(239,68,68,0.7); }
}

.status { text-align:center; font-size:13px; color:#7c9b8d; margin-top:10px; min-height:20px; font-weight:600; }
.log { margin-top:20px; padding:12px; background:rgba(0,0,0,0.3); border-radius:12px; font-size:12px; line-height:1.6; color:#6b8a7d; font-family:monospace; max-height:200px; overflow-y:auto; }
.log .ok { color:#10b981; }
.log .fail { color:#ef4444; }
</style>
</head>
<body>

<h1>🎤 Тест микрофона</h1>
<div class="sub">Проверка распознавания речи в браузере и в APK</div>

<div class="card">
  <div class="card-label">Поддержка браузера</div>
  <div class="card-value" id="support">Проверяю...</div>
</div>

<div class="card">
  <div class="card-label">Что услышано</div>
  <div class="card-value" id="heard">—</div>
</div>

<div class="card">
  <div class="card-label">Ошибки</div>
  <div class="card-value fail" id="error">—</div>
</div>

<button class="mic-btn" id="micBtn">🎤 Нажми и говори</button>
<div class="status" id="status">Готово к тесту</div>

<div class="log" id="log"></div>

<script>
var btn = document.getElementById('micBtn');
var support = document.getElementById('support');
var heard = document.getElementById('heard');
var errorEl = document.getElementById('error');
var status = document.getElementById('status');
var log = document.getElementById('log');

function addLog(msg, cls) {
  var line = document.createElement('div');
  line.className = cls || '';
  line.textContent = '› ' + msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

// Проверка поддержки
var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRec) {
  support.innerHTML = '<span class="ok">✅ Поддерживается</span>';
  addLog('SpeechRecognition API найден', 'ok');
} else {
  support.innerHTML = '<span class="fail">❌ НЕ поддерживается</span>';
  addLog('SpeechRecognition API отсутствует', 'fail');
}

if ('speechSynthesis' in window) {
  addLog('SpeechSynthesis (озвучка) доступен', 'ok');
} else {
  addLog('SpeechSynthesis отсутствует', 'fail');
}

if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  addLog('getUserMedia доступен', 'ok');
} else {
  addLog('getUserMedia отсутствует', 'fail');
}

// Тест записи
var rec = null;
var recording = false;

btn.onclick = function() {
  if (!SpeechRec) {
    errorEl.textContent = 'Распознавание речи недоступно в этом браузере';
    return;
  }

  if (recording && rec) {
    rec.stop();
    return;
  }

  errorEl.textContent = '—';
  heard.textContent = '—';

  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    stream.getTracks().forEach(function(t){ t.stop(); });
    addLog('Микрофон доступен, запускаю распознавание...', 'ok');

    rec = new SpeechRec();
    rec.lang = 'ru-RU';
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = function() {
      recording = true;
      btn.textContent = '🔴 Говори... (тап — стоп)';
      btn.classList.add('listening');
      status.textContent = 'Слушаю...';
      addLog('Распознавание запущено', 'ok');
    };

    rec.onresult = function(event) {
      var text = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
      }
      heard.innerHTML = '<span class="ok">' + text + '</span>';
      status.textContent = 'Услышано!';
    };

    rec.onerror = function(e) {
      errorEl.textContent = e.error + (e.message ? ': ' + e.message : '');
      addLog('Ошибка: ' + e.error, 'fail');
    };

    rec.onend = function() {
      recording = false;
      btn.textContent = '🎤 Нажми и говори';
      btn.classList.remove('listening');
      if (status.textContent === 'Слушаю...') status.textContent = 'Закончил слушать';
      addLog('Распознавание завершено');
      rec = null;
    };

    try {
      rec.start();
    } catch(e) {
      errorEl.textContent = 'Ошибка запуска: ' + e.message;
      addLog('Start error: ' + e.message, 'fail');
    }
  }).catch(function(e) {
    errorEl.textContent = 'Нет доступа к микрофону: ' + e.name + ' — ' + e.message;
    addLog('getUserMedia: ' + e.name, 'fail');
  });
};
</script>
</body>
</html>
